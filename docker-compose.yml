version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: aitriage_db
      POSTGRES_USER: triage_user
      POSTGRES_PASSWORD: triage_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage_user -d aitriage_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://triage_user:triage_password@db:5432/aitriage_db
      JWT_PRIVATE_KEY_PATH: /app/certs/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /app/certs/jwt_public.pem
      FCM_CREDENTIALS_PATH: /app/certs/firebase_service_account.json
    volumes:
      - ./certs:/app/certs
    ports:
      - "8000:8000"

  nginx:
    image: nginx:1.24-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  pgdata:
